<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Architectural Cobalt-to-Midnight brand squircle -->
    <linearGradient id="bg" x1="64" y1="0" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Subtle top-left radial illumination -->
    <radialGradient id="glow" cx="144" cy="72" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <!-- Luminous cyan-sky gradient for duplex plane & optical frame -->
    <linearGradient id="accent" x1="92" y1="92" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Concentric 16px negative-space knockout for back duplex card -->
    <mask id="duplexKnockout">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <rect x="104" y="186" width="264" height="180" rx="48" fill="#000000"/>
    </mask>

    <!-- Concentric geometric cutouts inside primary CR80 card -->
    <mask id="frontCardCutout">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <rect x="152" y="248" width="56" height="56" rx="14" fill="#000000"/>
      <rect x="228" y="252" width="92" height="20" rx="10" fill="#000000"/>
      <rect x="228" y="284" width="60" height="20" rx="10" fill="#000000"/>
    </mask>
  </defs>

  <!-- App Icon Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Symmetrical 4-Corner Optical Scan Frame (88..424, center 256) -->
  <g stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 156 V120 A32 32 0 0 1 120 88 H156"/>
    <path d="M356 88 H392 A32 32 0 0 1 424 120 V156"/>
    <path d="M88 356 V392 A32 32 0 0 0 120 424 H156"/>
    <path d="M356 424 H392 A32 32 0 0 0 424 392 V356"/>
  </g>

  <!-- Back Duplex CR80 Plane (160..392 x 162..310) with concentric 16px negative-space channel -->
  <rect x="160" y="162" width="232" height="148" rx="32" fill="url(#accent)" mask="url(#duplexKnockout)"/>

  <!-- Primary CR80 Card Plane (120..352 x 202..350) -->
  <rect x="120" y="202" width="232" height="148" rx="32" fill="#FFFFFF" mask="url(#frontCardCutout)"/>
</svg>
